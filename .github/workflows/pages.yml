# Tests the site, builds it for a plain web host and publishes it to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The least the two jobs need: read the code, publish a Pages deployment, and prove who is publishing it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits for the one in flight instead of cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run the unit tests
        run: node --test tests/*.test.js
      - name: Build the site
        run: node tools/build-pages.mjs "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
